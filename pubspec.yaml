name: doodle_time
description: A simple drawing and coloring app for young kids.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.0
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    # Emoji font for the web build only (loaded in main.dart). Android/iOS use the system emoji.
    - path: assets/fonts/NotoColorEmoji.ttf
      platforms: [web]
    - path: assets/fonts/NotoColorEmoji-LICENSE.txt
      platforms: [web]
