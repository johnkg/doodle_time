version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major bumps can change the Flutter SDK floor or break the build; take them deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
