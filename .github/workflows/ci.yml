name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform folders are not committed; generate them (existing files are kept).
      - name: Generate platform folders
        run: flutter create . --platforms=web --project-name doodle_time

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        # Bundle CanvasKit instead of loading it from Google's CDN (no network calls).
        # The base href is the GitHub Pages sub-path (https://<user>.github.io/doodle_time/).
        run: flutter build web --release --no-web-resources-cdn --base-href /doodle_time/

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Package site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    # Publish only what landed on main, after analyze, test and build passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
